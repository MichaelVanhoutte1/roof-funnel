name = "roof-funnel-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "api.startroofrejuvenating.com", custom_domain = true }
]

[vars]
# Comma-separated browser origins allowed to call the API.
ALLOWED_ORIGINS = "https://startroofrejuvenating.com,https://www.startroofrejuvenating.com"
# Leads are processed for these IP countries only; others get a silent success (no CRM).
ALLOWED_COUNTRIES = "US,CA"
# Secrets (wrangler secret put): GHL_WEBHOOK_URL (LeadConnector inbound-webhook workflow URL),
# ADMIN_TOKEN (bearer for GET /leads export).

[[d1_databases]]
binding = "DB"
database_name = "roof-funnel-leads"
database_id = "8d62a190-2570-4344-8013-09fb56779e25"
migrations_dir = "migrations"

# Sliding-ish per-IP limit: 8 submits per minute (the hourly cap lives in D1).
[[unsafe.bindings]]
name = "RL_MINUTE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
